<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Weekly Hours Log</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Track your work hours with weekly targets and progress monitoring"
    />
    <meta
      name="theme-color"
      content="#317727"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1a1a1a"
      media="(prefers-color-scheme: dark)"
    />

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Time Tracker" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/icons/icon-512x512.png"
    />

    <style>
      /* Default to dark background to prevent white flash on page load */
      body {
        background-color: #1a1a1a;
        color: #e0e0e0;
      }
    </style>
    <script>
      // Initialize dark mode early to prevent flash
      const theme = localStorage.getItem("theme");
      if (theme === "light") {
        document.body.style.backgroundColor = "#f7f7f7";
        document.body.style.color = "#000000";
        document.body.removeAttribute("data-theme");
      } else {
        document.body.setAttribute("data-theme", "dark");
      }
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript
      >Please enable JavaScript to continue using this application.</noscript
    >
  </body>
</html>
